      <form class="feedback-form glass reveal" id="feedback-form" novalidate>
        <div class="field-row">
          <label class="field">
            <span>反馈类型</span>
            <select name="type" id="fb-type">
              <option value="问题反馈">问题反馈</option>
              <option value="功能建议">功能建议</option>
              <option value="主题咨询">主题咨询</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label class="field">
            <span>昵称</span>
            <input type="text" name="name" id="fb-name" maxlength="40" placeholder="怎么称呼你" autocomplete="nickname">
          </label>
        </div>
        <label class="field">
          <span>联系方式 <em>可选</em></span>
          <input type="text" name="contact" id="fb-contact" maxlength="80" placeholder="QQ / 邮箱，方便回复你" autocomplete="email">
        </label>
        <label class="field">
          <span>问题描述 <em>必填</em></span>
          <textarea name="message" id="fb-message" rows="6" maxlength="2000" required placeholder="例如：在 PHP 8.5 下打开「曦主题设置 → 文章&列表」时页面空白，主题版本 V1.1（2610301）。"></textarea>
        </label>
        <div class="form-foot">
          <p class="form-note" id="fb-status" role="status" aria-live="polite">发送后会调用你的默认邮件应用。</p>
          <button class="btn btn-primary" type="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 16 8-16 8 3-8z"/></svg>
            撰写邮件
          </button>
        </div>
      </form>
    </div>
  </section>
</main>

