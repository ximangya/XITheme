<script>
  /* 首帧前确定深浅色，避免闪烁 */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('xi-site-theme'); } catch (e) {}
    var query = null;
    try { query = new URLSearchParams(location.search).get('theme'); } catch (e) {}
    if (query === 'light' || query === 'dark') saved = query;
    var dark = saved ? saved === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
